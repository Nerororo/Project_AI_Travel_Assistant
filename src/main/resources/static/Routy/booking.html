<main><section class="py-5 text-center text-white" style="background:linear-gradient(rgba(8,46,72,.65),rgba(8,46,72,.65)),url('img/tour-booking-bg.jpg') center/cover;"><div class="container"><p class="mb-2">STEP 3 OF 4</p><h1 class="display-5 text-white">여행 조건을 알려주세요</h1><p class="mb-0">날짜와 음식 선호를 입력하면 일정 추천에 반영합니다.</p></div></section><section class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><form class="bg-light p-4 p-md-5 rounded shadow-sm" action="packages.html"><div class="row g-4"><div class="col-md-6"><label class="form-label" for="startDate">여행 시작일</label><input class="form-control" id="startDate" type="date" required></div><div class="col-md-6"><label class="form-label" for="endDate">여행 종료일</label><input class="form-control" id="endDate" type="date" required></div><div class="col-12"><label class="form-label" for="foods">먹고 싶은 음식</label><input class="form-control" id="foods" type="text" placeholder="예: 스시, 라멘, 말차 디저트"><div class="form-text">여러 음식은 쉼표로 구분해 입력하세요.</div></div><div class="col-12"><label class="form-label" for="request">추가 요청</label><textarea class="form-control" id="request" rows="5" placeholder="예: 사람이 너무 많은 곳은 피하고 싶어"></textarea></div><div class="col-12 d-flex justify-content-between"><a class="btn btn-outline-primary" href="destination.html">이전</a><button class="btn btn-primary px-4" type="submit">호텔 선택으로 이동 <i class="fa fa-arrow-right ms-2"></i></button></div></div></form></div></div></section></main>
