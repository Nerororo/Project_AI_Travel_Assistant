spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

routy:
  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    endpoint: https://api.openai.com/v1/responses
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT_MS:3000}ms
    request-timeout: ${OPENAI_REQUEST_TIMEOUT_MS:15000}ms
