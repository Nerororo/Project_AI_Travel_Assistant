spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

routy:
  place:
    selection-token:
      issuer: ${PLACE_SELECTION_TOKEN_ISSUER:routy}
      active-key-id: ${PLACE_SELECTION_TOKEN_ACTIVE_KEY_ID}
      keys:
        - id: ${PLACE_SELECTION_TOKEN_ACTIVE_KEY_ID}
          secret: ${PLACE_SELECTION_TOKEN_ACTIVE_KEY_SECRET}
  kakao:
    local:
      rest-api-key: ${KAKAO_LOCAL_API_KEY}
      endpoint: https://dapi.kakao.com/v2/local/search/keyword.json
      connect-timeout: ${KAKAO_LOCAL_CONNECT_TIMEOUT_MS:2000}ms
      request-timeout: ${KAKAO_LOCAL_REQUEST_TIMEOUT_MS:6000}ms
    mobility:
      car-route:
        rest-api-key: ${KAKAO_MOBILITY_API_KEY}
        endpoint: https://apis-navi.kakaomobility.com/v1/directions
        connect-timeout: ${KAKAO_MOBILITY_CONNECT_TIMEOUT_MS:2000}ms
        request-timeout: ${KAKAO_MOBILITY_REQUEST_TIMEOUT_MS:6000}ms
    map:
      public-transit-route:
        rest-api-key: ${KAKAO_REST_API_KEY}
        endpoint: https://dapi.kakao.com/v2/routing/publictraffic
        connect-timeout: ${KAKAO_TRANSIT_CONNECT_TIMEOUT_MS:2000}ms
        request-timeout: ${KAKAO_TRANSIT_REQUEST_TIMEOUT_MS:6000}ms
  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    endpoint: https://api.openai.com/v1/responses
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT_MS:3000}ms
    request-timeout: ${OPENAI_REQUEST_TIMEOUT_MS:15000}ms
